spring:
  application:
    name: vantrack
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  jackson:
    date-format: yyyy-MM-dd
    time-zone: America/Sao_Paulo
  flyway:
    enabled: true
    validate-on-migrate: true
    locations:
      classpath:db/migration
    schemas: public
  jpa:
    open-in-view: false
  config:
    import: optional:file:.env[.properties]
server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  issuer: vantrack-api